<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ open }}" style="position:relative;display:flex;flex-direction:column;background:#ffffff;border:1px solid #e3edf5;border-radius:16px;box-shadow:0 7px 25px rgba(21,59,91,.05);height:100%;box-sizing:border-box;overflow:hidden;cursor:pointer" style-hover="border-color:#1677d2">

  <div style="position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,{{ coverA }},{{ coverB }});display:flex;flex-direction:column;justify-content:center;padding:16px 18px;overflow:hidden">
    <img src="{{ img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:{{ imgDisplay }}">
    <div style="position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:999px;background:rgba(255,255,255,.10);display:{{ fauxDisplay }}"></div>
    <div style="display:{{ fauxDisplay }};position:absolute;right:14px;top:14px;width:74px;height:52px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);display:flex;flex-direction:column;gap:3px;padding:6px">
      <span style="display:block;height:4px;width:70%;border-radius:2px;background:rgba(255,255,255,.6)"></span>
      <span style="display:block;height:4px;width:48%;border-radius:2px;background:rgba(255,255,255,.45)"></span>
      <span style="margin-top:auto;display:flex;gap:3px;align-items:flex-end;height:16px">
        <span style="display:block;width:7px;height:60%;background:rgba(255,255,255,.55);border-radius:1px"></span>
        <span style="display:block;width:7px;height:100%;background:rgba(255,255,255,.75);border-radius:1px"></span>
        <span style="display:block;width:7px;height:45%;background:rgba(255,255,255,.5);border-radius:1px"></span>
      </span>
    </div>
    <div style="display:{{ fauxDisplay }};position:relative;font-size:16px;font-weight:700;color:#fff;line-height:1.35;max-width:66%;text-wrap:pretty;text-shadow:0 1px 8px rgba(0,0,0,.18)">{{ cover }}</div>
    <div style="display:{{ fauxDisplay }};position:relative;margin-top:6px;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.82);letter-spacing:.02em">HOSxP Marketplace</div>
    <sc-if value="{{ hasAward }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border:1px solid #eed9a8;border-radius:999px;padding:4px 10px;box-shadow:0 4px 12px rgba(21,59,91,.18);max-width:calc(100% - 24px)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b8860b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 01-8 0zM12 12v4M8 20h8M16 5h3v2a3 3 0 01-3 3M8 5H5v2a3 3 0 003 3"></path></svg>
        <span style="font-size:10.5px;font-weight:700;color:#7a5405;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ awardLabel }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ hasRank }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px 3px 4px">
        <span style="width:20px;height:20px;border-radius:999px;background:#12315b;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ rank }}</span>
        <span style="font-size:10.5px;font-weight:700;color:#12315b">อันดับ</span>
      </div>
    </sc-if>
  </div>

  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;flex:1">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:9px">
      <span style="width:34px;height:34px;flex:none;border-radius:9px;background:#f0f7fd;border:1px solid #e3edf5;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ iconColor }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:{{ glyphShow }}"><path d="{{ iconD }}"></path></svg>
        <img src="assets/icons/exec.png" alt="" style="width:100%;height:100%;object-fit:cover;display:{{ appIconShow }}">
        <img src="assets/logo-bms.png" alt="BMS Group" style="width:26px;height:26px;object-fit:contain;display:{{ bmsShow }}">
      </span>
      <span style="font-size:14.5px;font-weight:700;color:#17324d;line-height:1.35;flex:1;min-width:0">{{ name }}</span>
      <span style="display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:{{ badgeBg }};color:{{ badgeColor }};white-space:nowrap;flex:none">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ badgeD }}"></path></svg>
        {{ badgeLabel }}
      </span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px" title="{{ devFull }}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ srcColor }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ srcD }}"></path></svg>
      <span style="font-size:12px;font-weight:600;color:{{ srcColor }};cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,0,0,.12);text-underline-offset:2px">{{ devName }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ verifyColor }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ verifyD }}"></path></svg>
    </div>

    <div style="font-size:12.5px;color:#6b7d90;line-height:1.55;margin-bottom:11px">{{ short }}</div>

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;margin-top:auto">
      <sc-for list="{{ tags }}" as="t" hint-placeholder-count="3">
        <span style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid {{ t.line }};color:{{ t.color }};background:{{ t.bg }}">{{ t.label }}</span>
      </sc-for>
      <sc-if value="{{ hasExtra }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#f0f5fa;color:#6b7d90">{{ extraLabel }}</span>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:#17324d;margin-bottom:11px">
      <span style="display:flex;align-items:center;gap:4px;font-weight:700">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#d99e2b" stroke="none"><path d="M12 4l2.5 5.3 5.5.7-4 3.9 1 5.6-5-2.9-5 2.9 1-5.6-4-3.9 5.5-.7z"></path></svg>
        {{ ratingLabel }}
      </span>
      <span style="color:#e3edf5">·</span>
      <span style="display:flex;align-items:center;gap:4px;color:#6b7d90" title="จำนวน รพ. ที่ยังใช้อยู่ใน 30 วัน">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16a394" stroke-width="1.7" stroke-linecap="round"><path d="M5 21V5h14v16M12 8v6M9 11h6"></path></svg>
        {{ hospitalsLabel }}
      </span>
    </div>

    <div style="border-top:1px solid #e3edf5;padding-top:11px;display:flex;align-items:center;justify-content:space-between">
      <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:{{ priceColor }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 7h18v10H3zM3 11h18"></path></svg>
        {{ priceLabel }}
      </span>
      <span style="font-size:12px;font-weight:600;color:#1677d2;display:flex;align-items:center;gap:4px;cursor:pointer">ดูรายละเอียด
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:440},&quot;addon&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Addon&quot;},&quot;rank&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const APPICONS = { exec: 'assets/icons/exec.png' };

const SRC = {
  bms:      { color: '#12315b', label: 'BMS',        d: 'M12 3l7 9-7 9-7-9z' },
  vendor:   { color: '#6b4fd8', label: 'Vendor',      d: 'M5 21V6l7-3 7 3v15M10 21v-4h4v4' },
  hospital: { color: '#16a394', label: 'โรงพยาบาล',  d: 'M5 21V5h14v16M12 8v6M9 11h6' },
  indie:    { color: '#b5732a', label: 'อิสระ',       d: 'M12 3a3.4 3.4 0 100 7 3.4 3.4 0 000-7zM5 21v-2a5 5 0 015-5h4a5 5 0 015 5v2' }
};
const VERIFY = {
  v3: { color: '#19a974', d: 'M12 3a9 9 0 100 18 9 9 0 000-18zM8 12.5l2.6 2.5L16 9.5' },
  v2: { color: '#19a974', d: 'M4 5h16v16H4zM8 12.5l2.6 2.5L16 9.5' },
  v1: { color: '#19a974', d: 'M12 3a9 9 0 100 18 9 9 0 000-18z' },
  v0: { color: '#9aa9b8', d: 'M12 3.5L21 20H3zM12 9v5M12 16.5v.5' }
};
const BADGE = {
  curated:   { label: 'คัดสรร',      color: '#8a6110', bg: '#fdf3dc', d: 'M12 4l2.5 5.3 5.5.7-4 3.9 1 5.6-5-2.9-5 2.9 1-5.6-4-3.9 5.5-.7z' },
  certified: { label: 'รับรอง',      color: '#0f7c55', bg: '#e6f7ef', d: 'M12 3l7 3v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V6zM9 12l2 2 4-4' },
  improving: { label: 'ปรับปรุง',    color: '#95610a', bg: '#fdf1dc', d: 'M12 3.5L21 20H3zM12 9v5M12 16.5v.5' },
  'new':     { label: 'ใหม่',        color: '#5238bd', bg: '#efebfe', d: 'M12 4l1.8 4.2L18 10l-4.2 1.8L12 16l-1.8-4.2L6 10l4.2-1.8z' }
};
const AXIS = {
  mission:    { color: '#c25c05', bg: '#fdf0e4', line: '#f6dcc4' },
  capability: { color: '#125fa8', bg: '#eaf3fc', line: '#cfe4f7' },
  persona:    { color: '#0f7f73', bg: '#e6f6f4', line: '#c9eae6' },
  domain:     { color: '#5c6e80', bg: '#f0f4f8', line: '#dfe7ee' }
};
const COVER = {
  'ระบบรายงาน':        ['#1677d2', '#0f4d8f'],
  'ระบบการเงิน':        ['#0f8f7f', '#12315b'],
  'ระบบเภสัชกรรม':      ['#6b4fd8', '#2a2a6b'],
  'ระบบคลินิก':         ['#16b8c8', '#106a94'],
  'ปัญญาประดิษฐ์':      ['#2a3f8f', '#0d2547'],
  'ระบบเชื่อมต่อ':      ['#1f6fd0', '#123a63'],
  'ระบบห้องปฏิบัติการ': ['#1a5fa8', '#0d2f52'],
  'ระบบบุคลากร':        ['#12a08f', '#0f4666'],
  'อื่นๆ':              ['#4a6c92', '#17324d']
};

class Component extends DCLogic {
  renderVals() {
    const a = this.props.addon || {};
    const src = SRC[a.sourceType] || SRC.hospital;
    const ver = VERIFY[a.verify] || VERIFY.v0;
    const badge = BADGE[a.badge] || BADGE.certified;
    const cov = COVER[a.cat] || COVER['อื่นๆ'];
    const all = [{ label: a.cat || 'อื่นๆ', axis: 'domain' }].concat(a.tags || []);
    const tags = all.slice(0, 3).map(t => {
      const ax = AXIS[t.axis] || AXIS.domain;
      return { label: t.label, color: ax.color, bg: ax.bg, line: ax.line };
    });
    const extra = Math.max(0, all.length - 3);
    const full = a.devName || '';
    return {
      name: a.name || '', short: a.short || '', cover: a.cover || a.name || '',
      coverA: cov[0], coverB: cov[1],
      hasAward: !!a.award && this.props.hideAward !== true, awardLabel: a.award || '',
      open: () => { if (typeof this.props.onOpen === 'function') this.props.onOpen(a.id); },
      appIcon: APPICONS[a.id] || '',
      appIconShow: APPICONS[a.id] ? 'block' : 'none',
      bmsShow: !APPICONS[a.id] && a.sourceType === 'bms' ? 'block' : 'none',
      glyphShow: !APPICONS[a.id] && a.sourceType !== 'bms' ? 'block' : 'none',
      img: a.id ? 'assets/banners/' + a.id + '.png' : '',
      imgDisplay: a.id ? 'block' : 'none',
      fauxDisplay: a.id ? 'none' : 'block',
      devName: full.length > 24 ? full.slice(0, 24) + '…' : full,
      devFull: full + ' — ' + src.label,
      srcColor: src.color, srcD: src.d,
      verifyColor: ver.color, verifyD: ver.d,
      badgeLabel: badge.label, badgeColor: badge.color, badgeBg: badge.bg, badgeD: badge.d,
      iconD: a.iconD || 'M4 4h16v16H4z', iconColor: src.color,
      tags, hasExtra: extra > 0, extraLabel: '+' + extra,
      ratingLabel: a.rating ? a.rating.toFixed(1) + ' (' + a.ratingCount + ')' : '0.0 (0)',
      hospitalsLabel: (a.hospitals || 0) + ' แห่ง',
      priceLabel: a.price || 'ฟรี',
      priceColor: (a.price || 'ฟรี') === 'ฟรี' ? '#19a974' : '#17324d',
      hasRank: !!this.props.rank, rank: this.props.rank
    };
  }
}
</script>
</body>
</html>
