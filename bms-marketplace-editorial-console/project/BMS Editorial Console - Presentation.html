document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 260px; min-width:0\">\n        <div style=\"font-size:11px; font-weight:700; color:#8a5a06; margin-bottom:4px\">บทบาทที่ไม่ได้ถือ — เห็นได้ แต่กดแล้วระบบจะแจ้งว่าไม่มีสิทธิ<\u002Fdiv>\n        <div style=\"display:flex; gap:5px; flex-wrap:wrap\">\n          <sc-for list=\"{{ personStrip.lacks }}\" as=\"px\" hint-placeholder-count=\"4\">\n            <span style=\"padding:2px 9px; border-radius:999px; font-size:11px; font-weight:500; background:#eef3f8; color:#6b7d90; white-space:nowrap\">{{ px.code }} · {{ px.name }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px; min-width:0; font-size:11px; color:#5b6f82; line-height:1.55; text-wrap:pretty\">{{ personStrip.hint }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ roleDoc.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#f4f8fd; border-bottom:1px solid #dbe6f0; padding:14px 22px; display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start\">\n        <div style=\"flex:1 1 240px; min-width:0\">\n          <div style=\"font-size:13.5px; font-weight:600; color:#12315b\">{{ roleDoc.name }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#41576b; margin-top:4px; line-height:1.6; text-wrap:pretty\">{{ roleDoc.mission }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ roleDoc.toggle }}\" style=\"font-size:11.5px; color:#1677d2; margin-top:8px; cursor:pointer; font-weight:600\">ซ่อนคำอธิบาย<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 280px; min-width:0\">\n          <div style=\"font-size:11.5px; font-weight:700; color:#0f7c55; letter-spacing:.02em\">ทำได้ในคอนโซล<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:4px; margin-top:6px\">\n            <sc-for list=\"{{ roleDoc.can }}\" as=\"ca\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; gap:7px; align-items:flex-start; fon ckground:{{ ac.bg }}; color:{{ ac.fg }}; border:1px solid {{ ac.line }}\">{{ ac.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ page.hasSubnav }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid #dbe6f0; padding-bottom:0\">\n          <sc-for list=\"{{ page.subnav }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ t.go }}\" style=\"padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; color:{{ t.fg }}; background:{{ t.bg }}; border:1px solid {{ t.bline }}; border-bottom:2px solid {{ t.line }}; border-radius:9px 9px 0 0; margin-bottom:-1px\">{{ t.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:12px; min-width:0\">\n          <sc-if value=\"{{ rv.veto.on }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fbe4e0; border:1px solid #e8b4ac; border-left:5px solid #7a1710; border-radius:12px; padding:12px 16px\">\n              <div style=\"display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#7a1710\">⛔ ชิ้นงานนี้ถูกยับยั้ง — ปุ่มอนุมัติหายไปจากทุกแท็บ ไม่ใช่เทา<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#5c1a13; margin-top:6px; line-height:1.6\">ยับยั้งโดย {{ rv.veto.by }} · {{ rv.veto.when }}<br><b>เหตุผลเชิงวิชาชีพ:<\u002Fb> {{ rv.veto.reason }}<br><b>ต้องแก้อะไรจึงจะยกเลิกการยับยั้ง:<\u002Fb> {{ rv.veto.fix }}<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:#7a1710; margin-top:6px; font-weight:600\">ยกเลิกได้เฉพาะคนที่ยับยั้ง หรือคนใหม่ในสายเดียวกันเมื่อคนเดิมพ้นวาระ — บรรณาธิการสูงสุดก็ปลดไม่ได้<\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:9px\">\n                <div sc-camel-on-click=\"{{               <div>\n                <div style=\"display:flex; justify-content:space-between; align-items:baseline\">\n                  <span style=\"font-size:12px; color:#6b7d90\">นาฬิกา SLA<\u002Fspan>\n                  <span style=\"font-family:Inter,sans-serif; font-size:13px; font-weight:600; color:{{ rv.info.slaFg }}\">{{ rv.info.slaText }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:7px; border-radius:99px; background:#eef3f8; margin-top:5px; overflow:hidden\">\n                  <div style=\"height:7px; border-radius:99px; width:{{ rv.info.slaPct }}%; background:{{ rv.info.slaBar }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:12px; color:#6b7d90; margin-bottom:6px\">สถานะ 7 ขั้น<\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:4px\">\n                  <sc-for list=\"{{ rv.stages }}\" as=\"st\" hint-placeholder-count=\"7\">\n                    <div style=\"display:flex; align-items:center; gap:8px\">\n                      <span style=\"width:18px; height:18px; border-radius:50%; background:{{ st.bg }}; color:{{ st.fg }}; font-family:Inter,sans-serif; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center\">{{ st.n }}<\u002Fspan>\n                      <span style=\"font-size:12px; color:#41576b\">{{ st.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top:1px dashed #e3edf5; padding-top:9px\">\n                <div style=\"font-size:12px; color:#6b7d90\">ผู้รับผิดชอบสายนี้<\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:500\">{{ rv.info.owner }}<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:#8a5a06; margin-top:3px\">{{ rv.info.laneNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Faside>\n\n            <div style=\"flex:3 1 420px; min-width:0; display:flex; flex-direction:column; gap:12px\">\n              <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n                <sc-for list=\"{{ rv.tabs }}\" as=\"t\" hint-placeholder-count=\"7\">\n                  <div sc-camel-on-click=\"{{ t.go }}\" style=\"padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ t.bg }}; color:{{ t.fg }}; border:1px solid {{ t.line }}\">{{ t.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ rv.tAuto }}\" hint-placeholder-val=\"{{ true }}\">\n                <section style=\"background:#fff; border:1px solid #dbe6f0; border-radius:14px; overflow:hidden\">\n                  <div style=\"padding:12px 15px; border-bottom:1px solid #e9f0f7; background:#f5f9fd\">\n                    <div style=\"font-size:14px; font-weight:600\">ส่วนที่ 1 · ผลตรวจอัตโนมัติของคอนโซลเอง (E2) — ผลผูกพัน<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#5b6f82; margin-top:2px\">รายงานสำเร็จรูปจากเครื่อง ไม่ให้คนกรอกซ้ำ · ถ้าตกข้อใด ระบบตีกลับให้ผู้พัฒนาก่อนเข้าคิวมนุษย์<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ rv.e2 }}\" as=\"e\" hint-placeholder-count=\"8\">\n                    <div style=\"display:grid; grid-template-columns:58px 1fr 88px; gap:10px; padding:9px 15px; border-top:1px solid #f0f5f9; align-items:start\">\n                      <div style=\"font-family:Inter,sans-serif; font-size:12px; font-weight:600; color:#41576b\">{{ e.code }}<\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:13px; font-weight:500\">{{ e.title }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px; color:#6b7d90; margin-top:2px\">หลักฐาน: {{ e.evidence }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"justify-self:end; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; background:{{ e.pbg }}; color:{{ e.pfg }}\">{{ e.plabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsection>\n\n                <section style=\"display:flex; flex-direction:column; gap:12px\">\n                  <div style=\"background:#f3f0ff; border:1px solid #ddd4fb; border-radius:12px; padding:12px 15px\">\n                    <div style=\"display:flex; align-items:baseline; gap:9px; flex-wrap:wrap\">\n                      <span style=\"padding:2px 9px; border-radius:6px; background:#4a3a95; color:#fff; font-family:Inter,sans-serif; font-size:11px; font-weight:600\">ส่วนที่ 2<\u002Fspan>\n                      <span style=\"font-size:14.5px; font-weight:700; color:#2d2170\">ผลตรวจ AI จาก Developer Portal<\u002Fspan>\n                      <span style=\"font-size:12px; color:#5b4bab\">เป็นหลักฐาน ไม่ใช่คำตัดสิน<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-family:Inter,sans-serif; font-size:11.5px; color:#5b4bab; margin-top:6px; line-height:1.6\">{{ rv.ai.engine }}<br>{{ rv.ai.produced }} · ผลรวม {{ rv.ai.score }} · {{ rv.ai.blocking }}<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <sc-for list=\"{{ rv.sections }}\" as=\"sec\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex; flex-direction:column; gap:9px\">\n                      <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#12315b; border-radius:10px; padding:9px 14px\">\n                        <span style=\"font-family:Inter,sans-serif; font-size:13px; font-weight:700; color:#8fc0f5\">สาย {{ sec.code }}<\u002Fspan>\n                        <span style=\"font-size:14px; font-weight:600; color:#fff; flex:1; min-width:0\">{{ sec.title }}<\u002Fspan>\n                        <span style=\"font-family:Inter,sans-serif; font-size:12.5px; font-weight:600; color:#cfe0f2\">{{ sec.score }}<\u002Fspan>\n                        <span style=\"padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; background:{{ sec.vbg }}; color:{{ sec.vfg }}\">{{ sec.vlabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12.5px; color:#41576b; padding:0 4px; line-height:1.6; text-wrap:pretty\">{{ sec.summary }}<\u002Fdiv>\n\n                      <sc-for list=\"{{ sec.criteria }}\" as=\"c\" hint-placeholder-count=\"2\">\n                        <div style=\"background:#fff; border:1px solid #dbe6f0; border-left:5px solid {{ c.vfg }}; border-radius:12px; box-shadow:0 6px 20px rgba(21,59,91,.06); overflow:hidden\">\n                          <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 15px; background:#fbfdff; border-bottom:1px solid #eef3f8\">\n                            <span style=\"font-family:Inter,sans-serif; font-size:12.5px; font-weight:700; color:#12315b; background:#e8f2fd; border-radius:6px; padding:3px 9px; white-space:nowrap\">{{ c.code }}<\u002Fspan>\n                            <span style=\"font-size:14.5px; font-weight:600; flex:1; min-width:180px; line-height:1.4; text-wrap:pretty\">{{ c.title }}<\u002Fspan>\n                            <span style=\"font-family:Inter,sans-serif; font-size:13px; font-weight:700; color:#41576b; white-space:nowrap\">{{ c.score }}<\u002Fspan>\n                            <span style=\"padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700; background:{{ c.vbg }}; color:{{ c.vfg }}; white-space:nowrap\">{{ c.vlabel }}<\u002Fspan>\n                          <\u002Fdiv>\n\n                          <div style=\"padding:12px 15px; display:flex; flex-direction:column; gap:11px\">\n                            <div style=\"display:flex; align-items:center; gap:9px\">\n                              <span style=\"font-family:Inter,sans-serif; font-size:11.5px; font-weight:600; color:#5b6f82; letter-spacing:.02em; white-space:nowrap\">ความมั่นใจของ AI {{ c.conf }}<\u002Fspan>\n                              <span style=\"flex:1; height:6px; border-radius:99px; background:#eef3f8; overflow:hidden; max-width:200px\"><span style=\"display:block; height:6px; width:{{ c.confPct }}%; background:#7a5af5\"><\u002Fspan><\u002Fspan>\n                            <\u002Fdiv>\n\n                            <div>\n                              <div style=\"font-family:Inter,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.05em; color:#41576b; margin-bottom:4px\">ผลการตรวจ<\u002Fdiv>\n                              <div style=\"font-size:13.5px; color:#17324d; line-height:1.7; text-wrap:pretty\">{{ c.finding }}<\u002Fdiv>\n                            <\u002Fdiv>\n\n                            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:9px\">\n                              <div style=\"background:#f5f8fb; border-radius:9px; padding:9px 11px\">\n                                <div style=\"font-family:Inter,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.05em; color:#5b6f82; margin-bottom:3px\">หลักฐาน<\u002Fdiv>\n                                <div style=\"font-family:Inter,sans-serif; font-size:11.5px; color:#41576b; line-height:1.6; word-break:break-word\">{{ c.ev }}<\u002Fdiv>\n                              <\u002Fdiv>\n                              <div style=\"background:#eefaf3; border-radius:9px; padding:9px 11px\">\n                                <div style=\"font-family:Inter,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.05em; color:#0f5c41; margin-bottom:3px\">แนวทางแก้ที่เสนอ<\u002Fdiv>\n                                <div style=\"font-size:12.5px; color:#0f5c41; line-height:1.6; text-wrap:pretty\">{{ c.fix }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n\n                            <sc-if value=\"{{ c.needReason }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"background:#fdecea; border:1px solid #f3c9c4; border-radius:9px; padding:9px 11px; font-size:12.5px; color:#8f231b; line-height:1.6\">ต้องเขียนเหตุผลที่ไม่เห็นด้วย — ระบบเก็บเป็นคู่ aiVerdict / humanVerdict เพื่อวัดความแม่นของ AI รายเกณฑ์<\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n\n                          <sc-if value=\"{{ sec.locked }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"border-top:1px solid #eef3f8; background:#fffaf0; padding:11px 15px; display:flex; align-items:center; gap:11px; flex-wrap:wrap\">\n                              <div sc-camel-on-click=\"{{ c.ack }}\" style=\"padding:8px 16px; border-radius:9px; background:{{ c.ackBg }}; color:{{ c.ackFg }}; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap\">{{ c.ackLabel }}<\u002Fdiv>\n                              <div style=\"font-size:11.5px; color:#8a5a06; flex:1; min-width:180px; line-height:1.55; text-wrap:pretty\">{{ sec.lockNote }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n\n                          <sc-if value=\"{{ c.showBtns }}\" hint-placeholder-val=\"{{ true }}\">\n                            <div style=\"border-top:1px solid #eef3f8; background:#f8fbfe; padding:11px 15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap\">\n                              <span style=\"font-size:11.5px; font-weight:600; color:#41576b; margin-right:2px; white-space:nowrap\">คุณต้องตัดสินข้อนี้:<\u002Fspan>\n                              <div sc-camel-on-click=\"{{ c.btnConfirm.go }}\" style=\"padding:8px 15px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ c.btnConfirm.bg }}; color:{{ c.btnConfirm.fg }}; border:1px solid {{ c.btnConfirm.line }}; white-space:nowrap\">✓ {{ c.btnConfirm.label }}<\u002Fdiv>\n                              <div sc-camel-on-click=\"{{ c.btnEdit.go }}\" style=\"padding:8px 15px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ c.btnEdit.bg }}; color:{{ c.btnEdit.fg }}; border:1px solid {{ c.btnEdit.line }}; white-space:nowrap\">{{ c.btnEdit.label }}<\u002Fdiv>\n                              <div sc-camel-on-click=\"{{ c.btnNo.go }}\" style=\"padding:8px 15px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ c.btnNo.bg }}; color:{{ c.btnNo.fg }}; border:1px solid {{ c.btnNo.line }}; white-space:nowrap\">{{ c.btnNo.label }}<\u002Fdiv>\n                              <div sc-camel-on-click=\"{{ c.propose }}\" style=\"margin-left:auto; padding:8px 13px; border-radius:9px; font-size:12px; color:#1677d2; border:1px dashed #bcd8f3; cursor:pointer; white-space:nowrap\">เสนอแก้เกณฑ์ข้อนี้ → portal<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsection>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ rv.tTier }}\" hint-placeholder-val=\"{{ false }}\">\n                <section style=\"background:#fff; border:1px solid #dbe6f0; border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:11px\">\n                  <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                    <div style=\"font-size:14px; font-weight:600; flex:1\">ตาราง 5 ปัจจัย · ระดับที่ได้ = ปัจจัยที่สูงสุด<\u002Fdiv>\n                    <span style=\"padding:4px 12px; border-radius:999px; font-size:13px; font-weight:700; background:#fdecea; color:#a52a21\">ผลลัพธ์ {{ rv.tierResult }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ rv.factors }}\" as=\"f\" hint-placeholder-count=\"5\">\n                    <div style=\"display:grid; grid-template-columns:170px 1fr 74px; gap:10px; align-items:start; padding:9px 0; border-top:1px solid #f0f5f9\">\n                      <div style=\"font-size:13px; font-weight:600\">{{ f.name }}<\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:12.5px; color:#41576b\">{{ f.found }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px; color:#a52a21; font-weight:600; margin-top:2px\">{{ f.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"justify-self:end; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:{{ f.lbg }}; color:{{ f.lfg }}\">{{ f.level }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"background:#eeeafe; border:1px solid #d7cdfb; border-radius:10px; padding:9px 12px; font-size:12.5px; color:#3e3080; line-height:1.6\">{{ rv.objection }}<\u002Fdiv>\n                  <sc-if value=\"{{ rv.canAdjust }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex; gap:9px; align-items:center; flex-wrap:wrap\">\n                      <div sc-camel-on-click=\"{{ rv.actTier }}\" style=\"padding:7px 14px; border-radius:9px; background:#12315b; color:#fff; font-size:12.5px; font-weight:600; cursor:pointer\">ปรับระดับ T (บังคับกรอกเหตุผล)<\u002Fdiv>\n                      <span style=\"font-size:11.5px; color:#6b7d90\">เปิดให้ผู้ตรวจ PDPA เท่านั้น<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsection>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ rv.tForm }}\" hint-placeholder-val=\"{{ false }}\">\n                <section style=\"background:#fff; border:1px solid #dbe6f0; border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:12px\">\n                  <div style=\"font-size:14px; font-weight:600\">แบบฟอร์มชั้น A · สาย {{ rv.formLane }} — ทุกข้อมี 3 ตัวเลือกเท่านั้น ไม่มีคะแนน ไม่มีค่ากลาง<\u002Fdiv>\n                  <sc-for list=\"{{ rv.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                    <div style=\"border:1px solid #e6eef6; border-radius:12px; padding:11px 13px; display:flex; flex-direction:column; gap:8px; background:#fcfdff\">\n                      <div style=\"display:flex; gap:9px; align-items:baseline\">\n                        <span style=\"font-family:Inter,sans-serif; font-size:12px; font-weight:700; color:#41576b\">{{ it.code }}<\u002Fspan>\n                        <span style=\"font-size:13.5px; font-weight:600; flex:1; min-width:0; text-wrap:pretty\">{{ it.title }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11.5px; color:#6b7d90\">{{ it.hint }}<\u002Fdiv>\n                      <div style=\"display:flex; gap:7px; flex-wrap:wrap\">\n                        <sc-for list=\"{{ it.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                          <div sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:6px 15px; border-radius:9px; font-size:12.5px; font-weight:{{ o.w }}; cursor:pointer; background:{{ o.bg }}; color:{{ o.fg }}; border:1px solid {{ o.line }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ it.needFail }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex; flex-direction:column; gap:7px\">\n                          <div style=\"font-size:11.5px; font-weight:600; color:#8f231b\">ตอบ “ไม่ผ่าน” ต้องกรอกครบสองช่องจึงจะบันทึกได้ (กติกาการปฏิเสธ)<\u002Fdiv>\n                          <textarea placeholder=\"หลักฐานว่าตกอย่างไร — อ้างบรรทัดโค้ด ภาพหน้าจอ หรือ log\" style=\"font-family:Sarabun,sans-serif; font-size:12.5px; padding:8px 10px; border:1px solid #f3c9c4; border-radius:9px; min-height:52px; resize:vertical; background:#fff\"><\u002Ftextarea>\n                          <textarea placeholder=\"แนวทางแก้ที่ทำได้จริง — ข้อความนี้ส่งถึงผู้พัฒนา\" style=\"font-family:Sarabun,sans-serif; font-size:12.5px; padding:8px 10px; border:1px solid #f3c9c4; border-radius:9px; min-height:52px; resize:vertical; background:#fff\"><\u002Ftextarea>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ it.needNa }}\" hint-placeholder-val=\"{{ false }}\">\n                        <input placeholder=\"เหตุผลสั้นว่าทำไมไม่เกี่ยวข้อง (บังคับ)\" style=\"font-family:Sarabun,sans-serif; font-size:12.5px; padding:8px 10px; border:1px solid #d9e4ee; border-radius:9px\">\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ it.preFilled }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:11.5px; color:#0f7c55; font-weight:600\">เติมล่วงหน้าจากผล AI แล้ว — ผู้ตรวจกดยืนยันทีละข้อหรือแก้ได้ (อนุญาตเฉพาะ A3 และ A4)<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ it.aiNote }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:11.5px; color:#8a5a06; background:#fff5e2; border:1px solid #f3dcae; border-radius:8px; padding:7px 9px\">{{ it.aiNote }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n\n                  <div style=\"border:1px solid #e6eef6; border-radius:12px; overflow:hidden\">\n                    <div style=\"padding:10px 13px; background:#f5f9fd; font-size:13.5px; font-weight:600\">เครื่องมือเฉพาะสาย A1 · ตารางที่ขอ ↔ ตารางที่พบการใช้จริงในโค้ด<\u002Fdiv>\n                    <sc-for list=\"{{ rv.perm }}\" as=\"p\" hint-placeholder-count=\"5\">\n                      <div style=\"display:grid; grid-template-columns:130px 1fr 1fr 150px; gap:10px; padding:8px 13px; border-top:1px solid #f0f5f9; align-items:center\">\n                        <div style=\"font-family:Inter,sans-serif; font-size:12.5px; font-weight:600\">{{ p.table }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px; color:#41576b\">ขอ: {{ p.declared }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px; color:#41576b\">พบใช้: {{ p.observed }}<\u002Fdiv>\n                        <span style=\"justify-self:end; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; background:{{ p.sbg }}; color:{{ p.sfg }}\">{{ p.state }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div style=\"border:1px solid #cfe4fb; background:#f4f9ff; border-radius:12px; padding:12px 13px; display:flex; flex-direction:column; gap:7px\">\n                    <div style=\"font-size:13.5px; font-weight:600; color:#0f4f8f\">ข้อความสิทธิ์ข้อมูลฉบับเผยแพร่ (ผู้ตรวจ PDPA อนุมัติ ไม่ใช่ผู้พัฒนาเขียนเอง)<\u002Fdiv>\n                    <textarea style=\"font-family:Sarabun,sans-serif; font-size:12.5px; padding:9px 11px; border:1px solid #cfe4fb; border-radius:9px; min-height:78px; resize:vertical; line-height:1.6\">{{ rv.publicText }}<\u002Ftextarea>\n                    <div style=\"font-size:11.5px; color:#5b6f82\">พรีวิว: ข้อความนี้จะขึ้นใน modal “ขอเปิดใช้” ของหน้าร้าน ก่อนที่โรงพยาบาลจะกดยืนยัน<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ rv.tB }}\" hint-placeholder-val=\"{{ false }}\">\n                <section style=\"background:#fff; border:1px solid #dbe6f0; border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:11px\">\n                  <div style=\"display:flex; align-items:baseline; gap:12px; flex-wrap:wrap\">\n                    <div style=\"font-size:14px; font-weight:600; flex:1\">คะแนนชั้น B · คำอธิบายเกณฑ์ติดอยู่ข้าง ๆ ไม่ต้องเปิดเอกสารอื่น<\u002Fdiv>\n                    <div style=\"font-family:Inter,sans-serif; font-size:20px; font-weight:600; color:#12315b\">{{ rv.bTotal }} / 100<\u002Fdiv>\n                    <span style=\"padding:3px 11px; border-radius:999px; font-size:12.5px; font-weight:700; background:#e6f6ee; color:#0f7c55\">กลุ่มที่จะได้: {{ rv.bGroup }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ rv.bitems }}\" as=\"b2\" hint-placeholder-count=\"6\">\n                    <div style=\"border-top:1px solid #f0f5f9; padding:10px 0; display:flex; flex-direction:column; gap:6px\">\n                      <div style=\"display:flex; align-items:baseline; gap:9px; flex-wrap:wrap\">\n                        <span style=\"font-family:Inter,sans-serif; font-size:12px; font-weight:700; color:#41576b\">{{ b2.code }}<\u002Fspan>\n                        <span style=\"font-size:13.5px; font-weight:600; flex:1; min-width:0\">{{ b2.title }}<\u002Fspan>\n                        <span style=\"font-family:Inter,sans-serif; font-size:13px; font-weight:600\">{{ b2.value }} / {{ b2.weight }}<\u002Fspan>\n                        <span style=\"padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; background:{{ b2.sbg }}; color:{{ b2.sfg }}\">{{ b2.state }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"height:7px; border-radius:99px; background:#eef3f8; overflow:hidden\"><div style=\"height:7px; width:{{ b2.pct }}%; background:#1677d2\"><\u002Fdiv><\u002Fdiv>\n                      <div style=\"font-size:11.5px; color:#6b7d90; text-wrap:pretty\">{{ b2.guide }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px; color:#4a3a95\">{{ b2.raw }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"background:#fff5e2; border:1px solid #f3dcae; border-radius:10px; padding:9px 12px; font-size:12px; color:#8a5a06; line-height:1.6\">{{ rv.bNote }}<\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ rv.tField }}\" hint-placeholder-val=\"{{ fa
